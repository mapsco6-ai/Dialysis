[tool.black]
line-length = 100
target-version = ["py311"]
extend-exclude = "migrations"

[tool.isort]
profile = "black"
line_length = 100
skip_glob = ["*/migrations/*"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.dev"
python_files = ["test_*.py", "*_test.py", "tests.py"]
testpaths = ["apps", "tests"]
