# Production on-premise stack: db + app + nginx + automated backups.
# Run from the repo root: docker compose -f deploy/docker-compose.yml --env-file .env up -d
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - dialysis_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    env_file:
      - ../.env
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - dialysis_static:/app/staticfiles
      - dialysis_media:/app/media

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "443:443"
      - "80:80"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/certs:/etc/nginx/certs:ro
      - dialysis_static:/app/staticfiles:ro
      - dialysis_media:/app/media:ro

  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      PGHOST: db
      BACKUP_RETENTION_DAILY: "14"
      BACKUP_RETENTION_WEEKLY: "8"
      BACKUP_RETENTION_MONTHLY: "6"
    volumes:
      - ./backup/backup.sh:/usr/local/bin/backup.sh:ro
      - ./backup/restore.sh:/usr/local/bin/restore.sh:ro
      - dialysis_backups:/backups
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        chmod +x /usr/local/bin/backup.sh /usr/local/bin/restore.sh
        echo "0 2 * * * /usr/local/bin/backup.sh >> /backups/backup.log 2>&1" > /etc/crontabs/root
        crond -f -l 2

volumes:
  dialysis_db_data:
  dialysis_static:
  dialysis_media:
  dialysis_backups:
